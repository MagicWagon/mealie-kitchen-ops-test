services:
  kitchen-ops:
    image: mealie-kitchen-ops:bulk-organizers-20260826
    container_name: mealie-kitchen-ops
    env_file: .env
    command: ["idle"]
    volumes:
      - /docker/appdata/mealie/mealie.db:/app/data/mealie.db:ro
      - /docker/appdata/kitchen-ops/config:/app/config:ro
      - /docker/appdata/kitchen-ops/logs:/app/logs
      - /docker/appdata/kitchen-ops/state:/app/state
    networks:
      - media_proxy
    restart: "no"

networks:
  media_proxy:
    external: true
